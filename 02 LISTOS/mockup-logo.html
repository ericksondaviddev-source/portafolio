<!doctype html><html><head><meta charset="utf-8"><title>mockup logo</title>
<style>
body{margin:0;font-family:system-ui;background:#0a1410;color:#e6f4ea;display:grid;gap:24px;padding:32px}
.row{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.box{background:#050a08;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:24px}
.clear{background:#fefcf7;color:#050a08}
img{display:block}
small{opacity:.7}
</style></head><body>
<div class="row box"><img src="/logo.svg" height="64"><small>logo.svg — horizontal</small></div>
<div class="row box"><img src="/logo.svg" height="40"><small>logo.svg — chico</small></div>
<div class="row box clear"><img src="/logo-claro.svg" height="64"><small>logo-claro.svg — sobre claro (og / documentos)</small></div>
<div class="row box">
  <img src="/favicon.svg" width="16" height="16"><img src="/favicon.svg" width="32" height="32"><img src="/favicon.svg" width="64" height="64">
  <small>favicon.svg — 16 / 32 / 64 px</small>
</div>
</body></html>
